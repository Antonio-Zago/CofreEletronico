# Configuração do Mosquitto do Cofre Eletrônico (dev e servidor).
# Montado em /mosquitto/config dentro do container (somente leitura).
# Contrato de tópicos: docs/ARQUITETURA.md (seção "Contrato MQTT").

# Persistência de mensagens retidas (estado/online) e sessões QoS 1.
persistence true
persistence_location /mosquitto/data/

# Log no stdout do container (docker compose logs mosquitto).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Autenticação/ACL globais, valendo para todos os listeners (1883 e o futuro 8883).
per_listener_settings false

# Sem acesso anônimo: todo cliente precisa de usuário/senha.
allow_anonymous false
# Gerado por infra/mosquitto/criar-usuario.sh (NUNCA versionado).
password_file /mosquitto/config/passwd
# ACL: backend x dispositivos (cada ESP32 só acessa cofre/<seu usuário>/#).
acl_file /mosquitto/config/acl

# O clientId passa a ser o próprio username: um cliente não consegue se
# conectar com o clientId de outro e derrubar/assumir a sessão dele.
# Consequência: só existe UMA conexão ativa por usuário. O backend deve usar
# uma única conexão MQTT (ou um usuário por instância, se escalar).
use_username_as_clientid true

# Limites ajustados ao contrato MQTT (payloads JSON pequenos, < 1 KB;
# um ESP32 por estante + backend; heartbeat periódico do ESP32).
# Pacote máximo em bytes (cmd/ack/estado cabem com folga).
max_packet_size 4096
# Mensagens QoS 1 enfileiradas por cliente offline/lento.
max_queued_messages 100
# Keepalive máximo aceito, em segundos (clientes com valor maior são ajustados).
max_keepalive 120

# Listener MQTT sem TLS. No host a porta publicada é MQTT_PORT (.env).
listener 1883 0.0.0.0
protocol mqtt
# Conexões simultâneas (ESP32 + backend). É opção de listener: vale para o
# listener acima e deve ser repetida no 8883 quando ele for habilitado.
max_connections 500

# -----------------------------------------------------------------------------
# Listener TLS (T-0608 / T-1202) - ainda não habilitado.
# Para habilitar: gerar certificados em infra/mosquitto/certs (não versionar a
# chave privada), montar em /mosquitto/certs, publicar a porta 8883 no compose
# e descomentar o bloco abaixo. Em produção, remover o listener 1883 ou
# restringi-lo a 127.0.0.1.
# -----------------------------------------------------------------------------
# listener 8883 0.0.0.0
# protocol mqtt
# max_connections 500
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# tls_version tlsv1.2
# require_certificate false
